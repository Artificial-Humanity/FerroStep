[workspace]
members = ["ferrostep-core", "ferrostep-ledger", "ferrostep-sqlite", "ferrostep-pocketbase", "ferrostep-notify", "ferrostep-cli", "ferrostep-github", "ferrostep-py", "xtask"]
resolver = "3"

# ferrostep-ts (NAPI-RS) is deliberately deferred until a TypeScript consumer
# exists — see AGENTS.md. The workspace layout already leaves room for it.

# Between cuts the tree carries the next number with a pre-release marker
# (docs/ROADMAP.md §Releases) — only a tagged commit claims a released
# version.
[workspace.package]
version = "0.1.1-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Artificial-Humanity/FerroStep"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

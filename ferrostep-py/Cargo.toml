[package]
name = "ferrostep-py"
description = "Python bindings for the FerroStep orchestration engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The importable module is `ferrostep._core`; maturin takes the final segment
# from `module-name` in pyproject.toml, and this lib name must match it.
[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
ferrostep-core = { path = "../ferrostep-core" }
serde_json = { workspace = true }
# `extension-module` is injected by maturin (see pyproject.toml) so that plain
# `cargo build`/`cargo test` still link against libpython and keep working.
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[package]
name = "ferrostep-cli"
description = "The person-facing surface over a FerroStep-refereed ledger: what awaits you, what happened, and the move that resolves it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferrostep"
path = "src/main.rs"

[dependencies]
ferrostep-core = { path = "../ferrostep-core", version = "0.1.0" }
ferrostep-ledger = { path = "../ferrostep-ledger", version = "0.1.0" }
ferrostep-sqlite = { path = "../ferrostep-sqlite", version = "0.1.0" }
ferrostep-pocketbase = { path = "../ferrostep-pocketbase", version = "0.1.0" }
ferrostep-notify = { path = "../ferrostep-notify", version = "0.1.0" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
